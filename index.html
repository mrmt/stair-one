<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STAIR ONE</title>
<style>
  /* 配色と書体は elevator-one と同じトークン */
  :root{
    --sea-top:#1D2A33;
    --sea-mid:#16222C;
    --sea-bot:#0E1720;
    --panel:rgba(255,255,255,.055);
    --panel-hi:rgba(255,255,255,.11);
    --line:rgba(226,236,242,.19);
    --ink:#E7E2CE;
    --dim:rgba(214,226,232,.62);
    --amber:#D8A340;
    --disp:'Futura','Avenir Next Condensed','Helvetica Neue',sans-serif;
    --data:'Menlo','Monaco',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--sea-mid);
    background-image:linear-gradient(180deg,var(--sea-top) 0%,var(--sea-mid) 52%,var(--sea-bot) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--disp);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  header{
    display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;
    padding:.8rem 1.2rem .7rem;
    background:rgba(0,0,0,.21);
    border-bottom:1px solid var(--line);
  }
  /* タイトル左のアイコン。親ディレクトリ (../) へ戻るリンク (elevator-one / two と同じ)。
     文字を持たないので baseline 揃えから外し、行の中央に置く */
  .home{display:flex;align-self:center;margin-right:-.4rem}
  .home svg{width:1.15rem;height:1.15rem;display:block;fill:var(--ink)}
  .mark{font-size:.95rem;letter-spacing:.42em;text-transform:uppercase}
  .sub{font-size:.68rem;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
  .ver{opacity:.6}

  main{
    flex:1;min-height:0;display:grid;
    grid-template-columns:minmax(250px,300px) minmax(0,1fr);
    gap:1px;background:var(--line);
  }
  section{background:rgba(0,0,0,.21);padding:1rem;min-width:0}
  .eyebrow{
    font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;
    color:var(--dim);margin-bottom:.85rem;
  }

  /* ---- 4x4 パッド ---- */
  .pads{display:flex;align-items:center;justify-content:center}
  .grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;
    /* 画面の短辺に合わせた正方形 */
    width:min(100%, calc(100dvh - 7rem));aspect-ratio:1;
  }
  .pad{
    position:relative;display:flex;flex-direction:column;justify-content:space-between;
    padding:.55rem .6rem;text-align:left;
    border:1px solid var(--line);background:var(--panel);
    /* 押している間だけ鳴るので、スクロール・長押しメニュー・選択を全部止める */
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    transition:background .25s,border-color .25s,color .25s,box-shadow .25s;
    overflow:hidden;
  }
  .pad:hover{background:var(--panel-hi)}
  .pad .no{font-family:var(--data);font-size:.62rem;color:var(--dim)}
  .pad .nm{font-size:clamp(.5rem,1.35vw,.78rem);letter-spacing:.14em;line-height:1.25;text-transform:uppercase}
  .pad .key{position:absolute;right:.5rem;top:.45rem;font-family:var(--data);font-size:.6rem;color:var(--dim);opacity:.7}
  .pad[aria-pressed="true"]{
    background:var(--amber);border-color:var(--amber);color:#101A22;
    box-shadow:0 0 28px rgba(216,163,64,.45);
    transition:none;
    animation:flicker .11s steps(2) infinite;
  }
  .pad[aria-pressed="true"] .no,.pad[aria-pressed="true"] .key{color:#101A22}
  @keyframes flicker{50%{background:#E3B55A}}

  /* ---- つまみ ---- */
  .controls{overflow-y:auto}
  /* 大8個は2列×4行。列優先で流し、左列 attack〜pitch、右列 delay〜phaser にする */
  .knobs{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:.9rem .6rem}
  .knobs.small{grid-template-rows:none;grid-auto-flow:row;margin-top:1.1rem;padding-top:1rem;border-top:1px solid var(--line)}
  .ctl{position:relative;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.25rem 0;text-align:center}
  .knob{position:relative;display:block;width:4.2rem;height:4.2rem;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none}
  .small .knob{width:2.9rem;height:2.9rem}
  .knob svg{display:block;width:100%;height:100%;overflow:visible}
  .knob .track,.knob .val{fill:none;stroke-width:5}
  .knob .track{stroke:var(--line);stroke-linecap:round}
  .knob .val{stroke:var(--amber)}
  .knob .body{fill:var(--panel-hi);stroke:var(--line);stroke-width:1.5}
  .knob .ptr{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
  /* 実体の range input はつまみに透明で重ねる。キーボード操作・読み上げ・MIDI 割当・テストの fill を担う */
  .knob input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
  .knob:has(input:focus-visible) svg{outline:2px solid var(--amber);outline-offset:3px;border-radius:50%}
  .ctl .lb{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
  .small .ctl .lb{font-size:.55rem}
  .ctl output{font-family:var(--data);font-size:.6rem;color:var(--amber)}
  .ctl .midi-badge{position:absolute;top:0;right:.1rem}
  .hint{font-size:.6rem;letter-spacing:.12em;color:var(--dim);line-height:1.7;margin-top:1.1rem}
  .hint a{color:inherit}

  /* ---- MIDI learn ---- */
  .midi{margin-left:auto;display:flex;gap:.55rem;align-items:center;align-self:center}
  .tbtn{
    border:1px solid var(--line);padding:.42rem .8rem;
    font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;
    background:var(--panel);transition:background .18s,border-color .18s,color .18s;
  }
  .tbtn:hover{background:var(--panel-hi)}
  .tbtn[aria-pressed="true"]{background:var(--amber);color:#101A22;border-color:var(--amber)}
  .tbtn[disabled]{opacity:.35;cursor:not-allowed}
  #midiStatus.warn{color:var(--amber)}
  .midi-badge{font-family:var(--data);font-size:.58rem;letter-spacing:0;color:var(--amber);text-transform:none}
  .pad .midi-badge{position:absolute;left:2.1rem;top:.5rem}
  .pad[aria-pressed="true"] .midi-badge{color:#101A22}
  /* learn 中: 割り当てられる要素を破線で示す。つまみは値を動かさず、ラベルごと選ぶ */
  body.learning .pad,body.learning .ctl{outline:1px dashed rgba(216,163,64,.55);outline-offset:2px;cursor:copy}
  body.learning .ctl input{pointer-events:none}
  body.learning .learn-sel{outline:2px solid var(--amber);animation:sel .5s steps(2) infinite}
  @keyframes sel{50%{outline-color:transparent}}

  /* 狭幅: パッドを上、つまみを下に積んでページをスクロールさせる (DOM はつまみが先なので order で入れ替える) */
  @media (max-width:760px){
    main{grid-template-columns:1fr}
    .pads{order:-1}
    .grid{width:100%;gap:.4rem}
    .pad{padding:.4rem}
    .pad .nm{font-size:.52rem;letter-spacing:.08em}
    .pad .key{display:none}
  }
</style>
</head>
<body>
<header>
  <!-- aria-label を "Back to top" にするとコンテンツブロッカーに隠される (elevator-one #39) ので Home にする -->
  <a class="home" href="../" aria-label="Home"><svg viewBox="0 0 512 512" aria-hidden="true"><g><path fill-rule="evenodd" d="M48 0H464A48 48 0 0 1 512 48V464A48 48 0 0 1 464 512H48A48 48 0 0 1 0 464V48A48 48 0 0 1 48 0ZM72 34H440A38 38 0 0 1 478 72V440A38 38 0 0 1 440 478H72A38 38 0 0 1 34 440V72A38 38 0 0 1 72 34Z"/><path d="M149 122L241 210L241 270L170 208V381H128V208L59 270V210Z"/><path d="M342 135H385V310L457 247V306L364 394L272 307V247L342 310Z"/></g></svg></a>
  <span class="mark">Stair One</span>
  <span class="sub">16 noise pads <span class="ver">v0.1</span></span>
  <div class="midi">
    <span class="sub" id="midiStatus" role="status"></span>
    <button class="tbtn" id="midiClear" hidden>clear all</button>
    <button class="tbtn" id="midiLearn" aria-pressed="false">MIDI learn</button>
  </div>
</header>
<main>
  <section class="controls">
    <!-- 列優先: 左列 attack / decay / release / pitch、右列 delay time / delay feedback / delay mix / phaser -->
    <div class="knobs">
      <label class="ctl"><span class="knob"><input type="range" id="s_attack" min="0" max="100" value="21"></span><span class="lb">attack</span><output for="s_attack"></output></label>
      <label class="ctl"><span class="knob"><input type="range" id="s_decay" min="0" max="100" value="60"></span><span class="lb">decay</span><output for="s_decay"></output></label>
      <label class="ctl"><span class="knob"><input type="range" id="s_release" min="0" max="100" value="53"></span><span class="lb">release</span><output for="s_release"></output></label>
      <label class="ctl"><span class="knob"><input type="range" id="s_pitch" min="-12" max="12" step="0.1" value="0"></span><span class="lb">pitch</span><output for="s_pitch"></output></label>
      <label class="ctl"><span class="knob"><input type="range" id="s_dtime" min="0" max="100" value="70"></span><span class="lb">delay time</span><output for="s_dtime"></output></label>
      <label class="ctl"><span class="knob"><input type="range" id="s_dfb" min="0" max="92" value="40"></span><span class="lb">delay feedback</span><output for="s_dfb"></output></label>
      <label class="ctl"><span class="knob"><input type="range" id="s_dmix" min="0" max="100" value="25"></span><span class="lb">delay mix</span><output for="s_dmix"></output></label>
      <label class="ctl"><span class="knob"><input type="range" id="s_phaser" min="0" max="100" value="20"></span><span class="lb">phaser</span><output for="s_phaser"></output></label>
    </div>
    <div class="knobs small">
      <label class="ctl"><span class="knob"><input type="range" id="s_drive" min="0" max="100" value="15"></span><span class="lb">distortion</span><output for="s_drive"></output></label>
      <label class="ctl"><span class="knob"><input type="range" id="s_volume" min="0" max="100" value="80"></span><span class="lb">volume</span><output for="s_volume"></output></label>
    </div>
    <p class="hint">押している間だけ鳴る / hold to sound<br>keys: 1234 QWER ASDF ZXCV<br>knob: drag ↕ / shift で微調整 / double-click で既定値<br><a href="../privacy/">privacy</a></p>
  </section>
  <section class="pads">
    <div class="grid" id="grid" role="group" aria-label="pads"></div>
  </section>
</main>

const KEYS = ['Digit1','Digit2','Digit3','Digit4','KeyQ','KeyW','KeyE','KeyR','KeyA','KeyS','KeyD','KeyF','KeyZ','KeyX','KeyC','KeyV'];
const KEY_LABEL = '1234QWERASDFZXCV';

// ============================================================
// スライダ
// ============================================================
const $ = id => document.getElementById(id);
// 時間系は対数カーブ
const logMap = (x, a, b) => a * Math.pow(b / a, x / 100);
const P = {
  attack:  () => logMap(+$('s_attack').value, .002, 4),
  decay:   () => logMap(+$('s_decay').value, .02, 6),
  release: () => logMap(+$('s_release').value, .01, 8),
  pitch:   () => +$('s_pitch').value,   // 半音
  drive:   () => +$('s_drive').value / 100,
  phaser:  () => +$('s_phaser').value / 100,
  dtime:   () => logMap(+$('s_dtime').value, .02, 1.2),
  dfb:     () => +$('s_dfb').value / 100,
  dmix:    () => +$('s_dmix').value / 100,
  volume:  () => +$('s_volume').value / 100,
};
const fmtSec = s => s < 1 ? `${Math.round(s * 1000)}ms` : `${s.toFixed(2)}s`;
const fmtPct = x => `${Math.round(x * 100)}`;
const fmtSt = st => `${st >= 0 ? '+' : ''}${st.toFixed(1)} st`;
const FMT = { attack: fmtSec, decay: fmtSec, release: fmtSec, dtime: fmtSec, pitch: fmtSt,
  drive: fmtPct, phaser: fmtPct, dfb: fmtPct, dmix: fmtPct, volume: fmtPct };

function updateReadouts(){
  for (const k of Object.keys(P)) document.querySelector(`output[for="s_${k}"]`).textContent = FMT[k](P[k]());
}

// ---- つまみ ----
// 弧は -135°〜+135°。pathLength=100 にして stroke-dasharray で値の範囲だけ描く
const KNOB_ARC = 'M18.89 81.11 A44 44 0 1 1 81.11 81.11';
const KNOB_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true"><path class="track" d="${KNOB_ARC}" pathLength="100"/><path class="val" d="${KNOB_ARC}" pathLength="100"/><circle class="body" cx="50" cy="50" r="32"/><line class="ptr" x1="50" y1="50" x2="50" y2="25"/></svg>`;

function drawKnob(input){
  const min = +input.min, max = +input.max;
  const f = (+input.value - min) / (max - min);
  const zero = min < 0 ? -min / (max - min) : 0;   // 両極 (pitch) は中央から弧を伸ばす
  const a = Math.min(f, zero), b = Math.max(f, zero);
  const knob = input.parentElement;
  knob.querySelector('.val').style.strokeDasharray = `0 ${a * 100} ${(b - a) * 100} 100`;
  knob.querySelector('.ptr').setAttribute('transform', `rotate(${-135 + 270 * f} 50 50)`);
}

for (const input of document.querySelectorAll('.knob input')) {
  const knob = input.parentElement;
  knob.insertAdjacentHTML('afterbegin', KNOB_SVG);
  const def = input.value;
  const range = () => +input.max - +input.min;
  const setValue = x => {
    const prev = input.value;
    input.value = String(x);   // min / max / step への丸めは input が行う
    if (input.value !== prev) input.dispatchEvent(new Event('input', { bubbles: true }));
  };
  input.addEventListener('input', () => { drawKnob(input); updateReadouts(); sendParam(input); });

  // 縦ドラッグ: 150px で全域、Shift で 4 倍細かく
  let drag = null;
  knob.addEventListener('pointerdown', e => {
    if (learning) return;   // learn 中は .ctl 側で割当先の選択になる
    e.preventDefault();
    try { knob.setPointerCapture(e.pointerId); } catch (err) {}
    input.focus({ preventScroll: true });
    drag = { id: e.pointerId, y: e.clientY, v: +input.value };
  });
  knob.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const px = e.shiftKey ? 600 : 150;
    setValue(drag.v + (drag.y - e.clientY) / px * range());
  });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) knob.addEventListener(type, () => { drag = null; });
  knob.addEventListener('wheel', e => {
    if (learning) return;
    e.preventDefault();
    setValue(+input.value - Math.sign(e.deltaY) * range() / (e.shiftKey ? 400 : 100));
  }, { passive: false });
  knob.addEventListener('dblclick', e => { e.preventDefault(); setValue(def); });
  drawKnob(input);
}
updateReadouts();

// ============================================================
// 音声 (最初の操作で AudioContext を作る)
//   AudioWorklet 1つが埋め込みの wasm (engine/) を 128 サンプルごとに呼ぶ。
//   メインスレッドからは押下 / 離鍵 / つまみの値を port で送るだけ
// ============================================================
const WORKLET_SRC = `
class StairEngine extends AudioWorkletProcessor {
  constructor(opt) {
    super();
    const { bytes, seed, params } = opt.processorOptions;
    const e = this.e = new WebAssembly.Instance(new WebAssembly.Module(bytes), {}).exports;
    this.h = e.stair_new(sampleRate, seed);
    params.forEach((v, i) => e.stair_set_param(this.h, i, v));
    this.pl = e.stair_out_l(this.h);
    this.pr = e.stair_out_r(this.h);
    this.frames = 0;
    this.port.onmessage = ({ data: m }) => {
      if (m.t === 'on') e.stair_note_on(this.h, m.pad);
      else if (m.t === 'off') e.stair_note_off(this.h, m.pad);
      else if (m.t === 'param') e.stair_set_param(this.h, m.i, m.v);
      else if (m.t === 'debug') this.port.postMessage({ t: 'debug', id: m.id, voices: this.debug() });
    };
  }
  debug() {
    const e = this.e, p = e.stair_debug(this.h) / 8, f = new Float64Array(e.memory.buffer);
    const out = [];
    for (let i = 0; i < f[p]; i++) {
      const o = p + 1 + i * 8;
      out.push({ pad: f[o], root: f[o + 1], cut: f[o + 2], pitch: f[o + 3], cents: f[o + 4], cv: f[o + 5],
        delay: Number.isNaN(f[o + 6]) ? undefined : f[o + 6], released: f[o + 7] > 0 });
    }
    return out;
  }
  process(inputs, outputs) {
    const out = outputs[0], n = out[0].length, e = this.e;
    e.stair_process(this.h, n);
    // wasm のメモリは作成時にしか伸びないが、念のため毎回 buffer から view を作る
    out[0].set(new Float32Array(e.memory.buffer, this.pl, n));
    if (out[1]) out[1].set(new Float32Array(e.memory.buffer, this.pr, n));
    // 鳴っているボイス数を約 50ms ごとに知らせる
    if ((this.frames += n) >= sampleRate / 20) {
      this.frames = 0;
      this.port.postMessage({ t: 'count', n: e.stair_voice_count(this.h) });
    }
    return true;
  }
}
registerProcessor('stair-engine', StairEngine);
`;
const WASM_BYTES = Uint8Array.from(atob(ENGINE_WASM), c => c.charCodeAt(0));

let ctx = null, resuming = null, node = null, pending = [], voiceCount = 0, debugSeq = 0;
const debugWaits = new Map();

// worklet ができるまでの操作は溜めておき、できたら順に送る
function send(m){
  if (node) node.port.postMessage(m); else pending.push(m);
}
function paramValues(){ return META.params.map(d => +$('s_' + d.id).value); }
function sendParam(input){
  const i = META.params.findIndex(d => 's_' + d.id === input.id);
  if (i >= 0 && ctx) send({ t: 'param', i, v: +input.value });
}

function ensureAudio(){
  if (ctx) {
    // resume は重ねて呼ばない
    if (ctx.state !== 'running' && !resuming) resuming = ctx.resume().catch(() => {}).finally(() => { resuming = null; });
    return true;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || !window.AudioWorkletNode) return false;   // Web Audio が無い環境では、押下と表示だけが動く
  ctx = new AC({ latencyHint: 'interactive' });
  // AudioWorklet を外部ファイルにしないよう data: URL で読み込む (Blob URL は file:// で開くと読み込めない)
  const url = 'data:text/javascript;charset=utf-8,' + encodeURIComponent(WORKLET_SRC);
  ctx.audioWorklet.addModule(url).then(() => {
    const seed = crypto.getRandomValues(new Uint32Array(1))[0];
    node = new AudioWorkletNode(ctx, 'stair-engine', {
      numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2],
      processorOptions: { bytes: WASM_BYTES.buffer.slice(0), seed, params: paramValues() },
    });
    node.port.onmessage = ({ data: m }) => {
      if (m.t === 'count') voiceCount = m.n;
      else if (m.t === 'debug') { debugWaits.get(m.id)?.(m.voices); debugWaits.delete(m.id); }
    };
    node.connect(ctx.destination);
    for (const m of pending) node.port.postMessage(m);
    pending = [];
  }).catch(err => console.error('stair-engine', err));
  return true;
}

function noteOn(pad){ send({ t: 'on', pad }); }
function noteOff(pad){ if (ctx) send({ t: 'off', pad }); }
// テスト用: worklet から今のボイスの中身をもらう (押下の後に送るので、押したボイスも入っている)
function debugVoices(){
  if (!ctx) return Promise.resolve([]);
  const id = ++debugSeq;
  return new Promise(ok => { debugWaits.set(id, ok); send({ t: 'debug', id }); });
}

// ============================================================
// 入力層
//   押下元 (ptr:<id> / key:<code> / midi:<key>) ごとに保持し、どれか1つでも押されていれば鳴らす。
// ============================================================
const holds = Array.from({ length: 16 }, () => new Set());
// MIDI learn の状態。learning 中はパッド / スライダを押すと割当先の選択になる
let learning = false, selected = null;
const padEls = [];

function press(pad, src){
  const h = holds[pad];
  if (h.has(src)) return;
  h.add(src);
  if (h.size === 1) {
    // 初回は AudioContext 生成で待たされることがあるので、点灯を先に出す
    padEls[pad].setAttribute('aria-pressed', 'true');
    if (ensureAudio()) noteOn(pad);
  }
}
function release(pad, src){
  const h = holds[pad];
  if (!h.delete(src)) return;
  if (h.size === 0) {
    noteOff(pad);
    padEls[pad].setAttribute('aria-pressed', 'false');
  }
}
function releaseAll(){
  holds.forEach((h, pad) => { for (const s of [...h]) release(pad, s); });
}

const grid = $('grid');
META.pads.forEach((name, i) => {
  const b = document.createElement('button');
  b.className = 'pad';
  b.dataset.pad = i;
  b.setAttribute('aria-pressed', 'false');
  b.setAttribute('aria-label', name);
  b.innerHTML = `<span class="no">${String(i + 1).padStart(2, '0')}</span><span class="key">${KEY_LABEL[i]}</span><span class="midi-badge"></span><span class="nm"></span>`;
  b.querySelector('.nm').textContent = name;
  const src = e => 'ptr:' + e.pointerId;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (learning) { selectTarget('pad:' + i); return; }
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
    press(i, src(e));
  });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(type, e => release(i, src(e)));
  b.addEventListener('contextmenu', e => e.preventDefault());
  grid.appendChild(b);
  padEls.push(b);
});

window.addEventListener('keydown', e => {
  // learn 中は演奏せず、Esc で抜ける / Delete で選択中の割当を外す
  if (learning) {
    if (e.code === 'Escape') { e.preventDefault(); setLearning(false); }
    else if ((e.code === 'Delete' || e.code === 'Backspace') && selected) { e.preventDefault(); unassign(selected); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = KEYS.indexOf(e.code);
  if (i < 0) return;
  e.preventDefault();
  if (!e.repeat) press(i, 'key:' + e.code);
});
window.addEventListener('keyup', e => {
  const i = KEYS.indexOf(e.code);
  if (i >= 0) release(i, 'key:' + e.code);
});
// フォーカスを失うと keyup / pointerup が届かず鳴りっぱなしになるので全部離す
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

// ============================================================
// MIDI learn
//   key: note:<ch>:<num> / cc:<ch>:<num> (入力デバイスは区別しない)
//   target: pad:<0-15> / slider:<input id>。1 target に 1 key、1 key に 1 target
// ============================================================
const MIDI_STORE = 'stair-one.midi.v1';
const midiLearnBtn = $('midiLearn'), midiClearBtn = $('midiClear'), midiStatus = $('midiStatus');
let midiAccess = null, midiRequest = null;

function targetEl(target){
  const [kind, id] = target.split(':');
  if (kind === 'pad') return padEls[+id] || null;
  const input = kind === 'slider' ? $(id) : null;
  return input ? input.closest('.ctl') : null;
}
function loadMidiMap(){
  try {
    const o = JSON.parse(localStorage.getItem(MIDI_STORE) || '{}');
    const map = {};
    for (const [k, t] of Object.entries((o && o.map) || {})) if (typeof t === 'string' && targetEl(t)) map[k] = t;
    return map;
  } catch (e) { return {}; }
}
function saveMidiMap(){
  try { localStorage.setItem(MIDI_STORE, JSON.stringify({ map: midiMap })); } catch (e) {}
}
const keyLabel = key => {
  const [type, ch, num] = key.split(':');
  return (type === 'note' ? 'N' : 'CC') + num + (ch !== '1' ? ` ch${ch}` : '');
};

// つまみにもバッジを置き、learn 中はラベルごと選べるようにする
for (const input of document.querySelectorAll('.controls input[type=range]')) {
  const ctl = input.closest('.ctl');
  const badge = document.createElement('span');
  badge.className = 'midi-badge';
  ctl.appendChild(badge);
  ctl.addEventListener('pointerdown', e => {
    if (!learning) return;
    e.preventDefault();
    selectTarget('slider:' + input.id);
  });
}

let midiMap = loadMidiMap();

function renderBadges(){
  document.querySelectorAll('.midi-badge').forEach(b => { b.textContent = ''; });
  for (const [key, target] of Object.entries(midiMap)) {
    const badge = targetEl(target)?.querySelector('.midi-badge');
    if (badge) badge.textContent = keyLabel(key);
  }
}
function assign(key, target){
  for (const [k, t] of Object.entries(midiMap)) if (t === target) delete midiMap[k];
  midiMap[key] = target;
  saveMidiMap(); renderBadges();
}
function unassign(target){
  for (const [k, t] of Object.entries(midiMap)) if (t === target) delete midiMap[k];
  saveMidiMap(); renderBadges();
}
function selectTarget(target){
  if (selected) targetEl(selected)?.classList.remove('learn-sel');
  selected = target;
  if (target) targetEl(target)?.classList.add('learn-sel');
}
function setLearning(on){
  learning = on;
  document.body.classList.toggle('learning', on);
  midiLearnBtn.setAttribute('aria-pressed', String(on));
  midiClearBtn.hidden = !on;
  if (on) releaseAll(); else selectTarget(null);
}
function setStatus(text, warn = false){
  midiStatus.textContent = text;
  midiStatus.classList.toggle('warn', warn);
}

function attachInputs(){
  let n = 0;
  for (const input of midiAccess.inputs.values()) {
    if (input.state === 'disconnected') continue;
    input.onmidimessage = onMidi;   // 代入でポートが開く
    n++;
  }
  setStatus(n ? `MIDI ${n} in` : 'no MIDI input');
}
function requestMidi(){
  if (midiRequest || !navigator.requestMIDIAccess) return;
  midiRequest = navigator.requestMIDIAccess().then(access => {
    midiAccess = access;
    access.onstatechange = e => {
      attachInputs();
      // 抜かれたデバイスの note off は届かないので、MIDI 由来の押下を全部離す
      if (e.port && e.port.type === 'input' && e.port.state === 'disconnected') {
        holds.forEach((h, pad) => { for (const s of [...h]) if (s.startsWith('midi:')) release(pad, s); });
      }
    };
    attachInputs();
  }).catch(() => { midiRequest = null; setStatus('MIDI denied', true); });
}

function onMidi(e){
  const [st, d1, d2 = 0] = e.data;
  const type = st & 0xf0, ch = (st & 0x0f) + 1;
  let key, on, value;
  if (type === 0x90 || type === 0x80) { key = `note:${ch}:${d1}`; on = type === 0x90 && d2 > 0; }
  else if (type === 0xb0) { key = `cc:${ch}:${d1}`; value = d2; on = d2 >= 64; }
  else return;

  if (learning) {
    if (!selected) return;
    const isCC = type === 0xb0;
    if (!isCC && !on) return;                              // note off では割り当てない
    if (selected.startsWith('slider:') && !isCC) return;  // スライダは CC のみ
    assign(key, selected);
    selectTarget(null);
    return;
  }

  const target = midiMap[key];
  if (!target) return;
  // MIDI 入力はユーザー操作扱いにならず、音声を解錠できない
  if (!ctx || ctx.state !== 'running') setStatus('click to enable sound', true);
  else if (midiStatus.classList.contains('warn')) attachInputs();

  const [kind, id] = target.split(':');
  if (kind === 'pad') {
    if (on) press(+id, 'midi:' + key); else release(+id, 'midi:' + key);
  } else if (value !== undefined) {
    const input = $(id);
    const min = +input.min, max = +input.max;
    input.value = String(Math.round(min + (max - min) * value / 127));
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }
}

if (navigator.requestMIDIAccess) {
  midiLearnBtn.addEventListener('click', () => {
    ensureAudio();   // ボタン押下はユーザー操作なので、ここで音声も解錠しておく
    requestMidi();
    setLearning(!learning);
  });
  midiClearBtn.addEventListener('click', () => {
    midiMap = {};
    saveMidiMap(); renderBadges(); selectTarget(null);
  });
  // 保存済みの割当があれば、learn を押さなくても MIDI で弾けるようにする
  if (Object.keys(midiMap).length) requestMidi();
} else {
  midiLearnBtn.disabled = true;
  midiLearnBtn.title = 'このブラウザは Web MIDI 非対応 / Web MIDI is not supported';
}
renderBadges();

// MIDI だけで弾き始めると音が出ないので、ページ上の最初の操作で音声を解錠する
// パッド・learn ボタン・演奏キーは自前で解錠するので除外し、1回の操作で初期化を重ねない
const unlockAudio = e => {
  if (e.target instanceof Element && e.target.closest('.pad, #midiLearn')) return;
  if (e.type === 'keydown' && KEYS.includes(e.code)) return;
  if (!ctx || ctx.state !== 'running') ensureAudio();
};
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('keydown', unlockAudio);

// 外部入力とテストから使う口
window.stair = {
  press, release, releaseAll,
  midiMap: () => ({ ...midiMap }),
  voiceCount: () => voiceCount,
  debug: debugVoices,
  meta: () => META,
};
})();
</script>
</body>
</html>
